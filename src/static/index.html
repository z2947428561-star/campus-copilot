<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Copilot · XMUM 校园智能助手</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --me: #2f6df6; --me-text: #fff;
    --bot: #ffffff; --border: #e3e6ea; --text: #1f2329; --muted: #8a919c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1d2026; --me: #3b74f2; --me-text: #fff;
      --bot: #24282f; --border: #2e333c; --text: #e8eaed; --muted: #9aa1ad;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 18px; display: flex; align-items: center; gap: 12px;
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 9px; background: var(--me);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px;
  }
  header .title { font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .user-box { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  header .who { font-size: 13px; color: var(--muted); }
  header .who b { color: var(--text); }
  header button.link {
    background: none; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  /* 登录遮罩:未登录时盖住整个聊天区 */
  #login-mask {
    position: fixed; inset: 0; background: var(--bg);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #login-mask.show { display: flex; }
  #login-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px 30px; width: 320px; display: flex; flex-direction: column; gap: 12px;
  }
  #login-card h2 { margin: 0 0 4px; font-size: 18px; }
  #login-card .tip { font-size: 12px; color: var(--muted); margin: 0; }
  #login-card input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 14px; font-size: 14.5px; outline: none;
  }
  #login-card input:focus { border-color: var(--me); }
  #login-card .row { display: flex; gap: 10px; }
  #login-card button {
    flex: 1; border: none; border-radius: 10px; padding: 11px 0;
    font-size: 14.5px; cursor: pointer;
  }
  #login-card .primary { background: var(--me); color: #fff; }
  #login-card .ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #login-err { color: #d84a3a; font-size: 12.5px; min-height: 16px; margin: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.55; font-size: 14.5px; }
  .msg.me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; color: var(--muted); font-size: 12px; background: none; }
  .msg .cursor { display: inline-block; width: 7px; height: 15px; background: var(--me); vertical-align: -2px; animation: blink 1s infinite; border-radius: 1px; }
  @keyframes blink { 50% { opacity: 0; } }
  #confirm-bar {
    display: none; align-self: center; gap: 10px; padding: 12px 16px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    flex-direction: column; max-width: 82%;
  }
  #confirm-bar .desc { font-size: 14px; }
  #confirm-bar .btns { display: flex; gap: 10px; }
  #confirm-bar button { border: none; border-radius: 8px; padding: 8px 20px; font-size: 14px; cursor: pointer; }
  #confirm-bar .yes { background: #d84a3a; color: #fff; }
  #confirm-bar .no { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  footer {
    background: var(--panel); border-top: 1px solid var(--border); padding: 14px 18px;
    display: flex; gap: 10px;
  }
  footer input#input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 14px; font-size: 14.5px; outline: none;
  }
  footer input#input:focus { border-color: var(--me); }
  footer button {
    background: var(--me); color: #fff; border: none; border-radius: 10px;
    padding: 0 22px; font-size: 14.5px; cursor: pointer;
  }
  footer button:disabled { opacity: .5; cursor: default; }
  #data-panel { display: none; position: fixed; right: 16px; top: 65px; z-index: 8;
    width: min(360px, calc(100vw - 32px)); padding: 16px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px #0002; }
  #data-panel.open { display: block; }
  #data-panel h3 { margin: 0 0 8px; font-size: 15px; }
  #data-panel p { font-size: 12px; color: var(--muted); }
  #data-panel .row { display: flex; gap: 6px; margin: 8px 0; }
  #data-panel input { min-width: 0; flex: 1; padding: 8px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 7px; color: var(--text); }
  #data-panel button { padding: 7px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--text); cursor: pointer; }
  #data-status { min-height: 18px; }
</style>
</head>
<body>
<header>
  <div class="logo">校</div>
  <div>
    <div class="title">Campus Copilot</div>
    <div class="sub">XMUM 校园智能助手 · 校历/课表/GPA/教务政策</div>
  </div>
  <div class="user-box">
    <span class="who">你好,<b id="who"></b></span>
    <button class="link" onclick="toggleData()">个人数据</button>
    <button class="link" onclick="logout()">登出</button>
  </div>
</header>

<section id="data-panel" aria-label="个人数据">
  <h3>我的课程与成绩</h3>
  <p>课程和成绩由你自行录入；排课为演示数据，并非学校系统记录。</p>
  <div class="row"><input id="course-id" placeholder="课程代码，如 CS101"><button onclick="saveCourse()">添加课程</button></div>
  <div class="row"><input id="grade-course" placeholder="课程代码"><input id="grade-point" type="number" min="0" max="4" step="0.01" placeholder="绩点"><input id="grade-letter" placeholder="等级"><button onclick="saveGrade()">保存成绩</button></div>
  <p id="data-status"></p><div id="data-list"></div>
</section>

<div id="login-mask">
  <div id="login-card">
    <h2>Campus Copilot</h2>
    <p class="tip">登录后才有你的专属记忆(年级/专业/常问话题)</p>
    <input id="login-user" placeholder="用户名(2-32 位)" autocomplete="username">
    <input id="login-pass" type="password" placeholder="注册密码至少 12 位" autocomplete="current-password">
    <p id="login-err"></p>
    <div class="row">
      <button class="primary" onclick="doAuth('login')">登录</button>
      <button class="ghost" onclick="doAuth('register')">注册并登录</button>
    </div>
  </div>
</div>

<div id="chat">
  <div class="msg sys">试试:「现在第几教学周」「重修要交钱吗」「帮我算 GPA」「周三10点哪有空教室」</div>
</div>

<div id="confirm-bar">
  <div class="desc" id="confirm-desc"></div>
  <div class="btns">
    <button class="yes" onclick="decide(true)">放行执行</button>
    <button class="no" onclick="decide(false)">拒绝</button>
  </div>
</div>

<footer>
  <input id="input" placeholder="输入问题,回车发送..." autocomplete="off">
  <button id="send" onclick="send()">发送</button>
</footer>

<script>
const $ = id => document.getElementById(id);
const chat = $("chat");
const input = $("input");
const sendBtn = $("send");
const confirmBar = $("confirm-bar");

// 会话凭证:token 存 localStorage;user_id 不再自报,由服务端从 token 解析
let token = localStorage.getItem("cc_token") || "";
let whoami = localStorage.getItem("cc_user") || "";

function showLogin(err) {
  $("data-panel").classList.remove("open");
  $("login-mask").classList.add("show");
  $("login-err").textContent = err || "";
  $("login-user").focus();
}
function showChat() {
  $("login-mask").classList.remove("show");
  $("who").textContent = whoami;
  input.focus();
}
if (!token) showLogin(); else showChat();

async function doAuth(kind) {
  const username = $("login-user").value.trim();
  const password = $("login-pass").value;
  $("login-err").textContent = "";
  try {
    const resp = await fetch("/api/" + kind, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await resp.json();
    if (!resp.ok) { $("login-err").textContent = data.detail || "操作失败"; return; }
    token = data.token; whoami = data.user_id;
    localStorage.setItem("cc_token", token);
    localStorage.setItem("cc_user", whoami);
    showChat();
  } catch (e) {
    $("login-err").textContent = "网络错误:" + e;
  }
}

async function logout() {
  try { await fetch("/api/logout", { method: "POST", headers: { "Authorization": "Bearer " + token } }); } catch (e) {}
  token = ""; whoami = "";
  localStorage.removeItem("cc_token");
  localStorage.removeItem("cc_user");
  showLogin();
}

async function dataRequest(path, method, body) {
  const resp = await fetch(path, { method, headers: {
    "Authorization": "Bearer " + token, "Content-Type": "application/json"
  }, body: body ? JSON.stringify(body) : undefined });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.detail || "请求失败");
  return data;
}
async function refreshData() {
  try {
    const [courses, grades] = await Promise.all([
      dataRequest("/api/me/courses", "GET"), dataRequest("/api/me/grades", "GET")
    ]);
    const list = $("data-list"); list.replaceChildren();
    function section(title, rows, kind, label) {
      const heading = document.createElement("p"); heading.textContent = title; list.appendChild(heading);
      if (!rows.length) { const empty = document.createElement("p"); empty.textContent = "暂无"; list.appendChild(empty); }
      for (const row of rows) {
        const line = document.createElement("div"); line.className = "row";
        const value = document.createElement("span"); value.style.flex = "1"; value.textContent = label(row);
        const remove = document.createElement("button"); remove.textContent = "删除";
        remove.onclick = async () => {
          try { await dataRequest("/api/me/" + kind + "/" + encodeURIComponent(row.course_id), "DELETE");
            $("data-status").textContent = "已删除 " + row.course_id; await refreshData();
          } catch (e) { $("data-status").textContent = e.message; }
        };
        line.append(value, remove); list.appendChild(line);
      }
    }
    section("已选课程", courses.courses, "courses", c => c.course_id + " " + c.name);
    section("已录成绩", grades.grades, "grades", g => g.course_id + " " + g.letter + " (" + g.grade_point + ")");
  } catch (e) { $("data-status").textContent = e.message; }
}
function toggleData() {
  $("data-panel").classList.toggle("open");
  if ($("data-panel").classList.contains("open")) refreshData();
}
async function saveCourse() {
  try {
    await dataRequest("/api/me/courses", "PUT", {course_id: $("course-id").value.trim()});
    $("data-status").textContent = "课程已保存"; await refreshData();
  } catch (e) { $("data-status").textContent = e.message; }
}
async function saveGrade() {
  try {
    if (!$("grade-point").value || !$("grade-letter").value.trim()) throw new Error("请填写绩点和等级");
    await dataRequest("/api/me/grades", "PUT", {
      course_id: $("grade-course").value.trim(),
      grade_point: Number($("grade-point").value), letter: $("grade-letter").value.trim()
    });
    $("data-status").textContent = "成绩已保存"; await refreshData();
  } catch (e) { $("data-status").textContent = e.message; }
}

$("login-pass").addEventListener("keydown", e => { if (e.key === "Enter") doAuth("login"); });

let busy = false;
let pendingResume = false;

function addMsg(cls, text, withCursor) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  // 显式创建文本节点:div.textContent = "" 不会留下任何子节点,
  // 之后 childNodes[0] 会错拿到光标 span(7px 宽),回复全挤进光标里变成竖排
  div.appendChild(document.createTextNode(text || ""));
  if (withCursor) {
    const c = document.createElement("span");
    c.className = "cursor";
    div.appendChild(c);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

async function streamChat(body) {
  busy = true; sendBtn.disabled = true;
  const botDiv = addMsg("bot", "", true);
  const textNode = botDiv.childNodes[0];
  const cursor = botDiv.childNodes[1];

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(body),
    });
    if (resp.status === 401) {  // token 过期/失效:回登录页
      botDiv.remove();
      localStorage.removeItem("cc_token"); token = "";
      showLogin("登录已过期,请重新登录");
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let gotInterrupt = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!raw.startsWith("data: ")) continue;
        const ev = JSON.parse(raw.slice(6));
        if (ev.type === "token") {
          textNode.textContent += ev.text;
          scrollBottom();
        } else if (ev.type === "interrupt") {
          gotInterrupt = true;
          $("confirm-desc").textContent = "⚠ " + (ev.description || "敏感操作需要确认")
            + "\n即将执行:" + ev.tool + "(" + JSON.stringify(ev.args) + ")";
          confirmBar.style.display = "flex";
          scrollBottom();
        } else if (ev.type === "error") {
          textNode.textContent += "\n[出错了] " + ev.message;
        }
      }
    }
    cursor.remove();
    if (!textNode.textContent) botDiv.remove();
    pendingResume = gotInterrupt;
  } catch (e) {
    cursor && cursor.remove();
    textNode.textContent += "\n[连接失败] " + e;
  }
  busy = false; sendBtn.disabled = false;
  input.focus();
}

async function send() {
  if (busy) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMsg("me", text);
  await streamChat({ message: text });
}

async function decide(ok) {
  if (busy) return;
  confirmBar.style.display = "none";
  if (!pendingResume) return;
  if (!ok) addMsg("sys", "已拒绝该敏感操作");
  await streamChat({ resume: ok });
}

input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
input.focus();
</script>
</body>
</html>
