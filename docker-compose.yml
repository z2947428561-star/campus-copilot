# Campus Copilot 部署编排(app + PostgreSQL + Milvus)
#
# 已在本机 WSL Docker 验证构建与 app + PostgreSQL + Chroma + Caddy 本机 HTTPS；
# 真实公网域名证书仍需在云服务器验证。
#
# 【一次性准备】
# 1. 装 WSL2(管理员 PowerShell):wsl --install → 重启
# 2. 装 Docker Desktop,勾选 "Use WSL 2 instead of Hyper-V"
#    设置里把内存上限压到 4GB 以内(Milvus 常驻约 1GB,小内存机器会开始 swap)
# 3. 本机装 PostgreSQL 16(端口保持 5432),建库建用户:
#      CREATE DATABASE campus;
#      CREATE USER campus WITH PASSWORD 'campus_pw';
#      GRANT ALL PRIVILEGES ON DATABASE campus TO campus;
#    (容器内的 postgres 服务会自动建库建用户,上面两条只在你打算直连宿主机 PG 时才需要)
#
# 【首次部署】
# 5. 复制 .env.example 为 .env，填 DEEPSEEK_API_KEY / EMBED_API_KEY /
#    POSTGRES_PASSWORD；正式发布还需 CAMPUS_DOMAIN 和已解析的 DNS。
#    LANGSMITH_API_KEY 可选；云上建议 LANGSMITH_TRACING=false。
# 6. 本地 docker compose up -d --build；正式环境加 --profile production。
# 7. 等 Milvus 就绪(docker compose ps 三个服务 healthy),然后**建知识库**:
#      docker compose exec app python scripts/build_kb.py
#    ⚠️ 这一步是必须的:Milvus 里的向量数据存放在 milvus_data 卷,不随镜像走。
#    换过 Embedding 模型也必须重跑(向量空间变了)。
# 8. 验证:docker compose exec app python -c "import urllib.request;print(urllib.request.urlopen('http://localhost:8000/api/health').read())"
#
# 【常见坑】
# - 没有 EMBED_API_KEY → build_kb.py 会报"缺少 EMBED_API_KEY",
#   而 search_policy 会诚实返回"知识库未接入"(不是崩溃)
# - 想跳过 Milvus 先用旧 Chroma 过渡:.env 设 KB_BACKEND=chroma(不必起 milvus 服务)
# - 容器内不需要 Ollama:Embedding 走云端网关(课件第10章 §2.4.2 p48-49),
#   模型降级备胎也用云端便宜模型(第08章 §3.3 p53)。
#   下面的 ollama profile 只为"想在云端复现本地降级实验"保留。
# - /api/chat 必须带 Bearer token；正式环境经 Caddy 使用 HTTPS。
#
# 常用命令:
#   docker compose up -d --build            # 起全部服务
#   docker compose logs -f app              # 看应用日志
#   docker compose exec app python scripts/build_kb.py   # 重建知识库
#   docker compose --profile ollama up -d   # 额外起本地 Ollama(通常不需要)
#   docker compose down                     # 停止(保留数据卷)
#

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # 模型参数(第02章 §3.3 p15-16):容器里也应可调,而不是写死在代码里
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2048}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-6}
      - LLM_CHEAP_MODEL=${LLM_CHEAP_MODEL:-deepseek-chat}
      # LangSmith 四个变量(第03章 §2.3 p6)。云上默认关闭 tracing:
      # trace 里含同学的真实问答,不该默认外传
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-campus-copilot}
      # Embedding 走云端网关(第10章 §2.4.2 p48-49);容器内不需要本机 Ollama
      - EMBED_API_KEY=${EMBED_API_KEY}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-https://api.siliconflow.cn/v1}
      - EMBED_MODEL=${EMBED_MODEL:-BAAI/bge-m3}
      - EMBED_DIM=${EMBED_DIM:-1024}
      # 向量库(第10章 §2.5.3 p52-54):指向 compose 里的 milvus 服务
      - KB_BACKEND=${KB_BACKEND:-milvus}
      - MILVUS_URI=http://milvus:19530
      - MILVUS_DB_NAME=${MILVUS_DB_NAME:-campus_copilot}
      - MILVUS_COLLECTION=${MILVUS_COLLECTION:-xmum_policies}
      - MILVUS_METRIC_TYPE=${MILVUS_METRIC_TYPE:-COSINE}
      # 记忆后端:SQLite(默认)→ PostgreSQL 一行切换,业务代码零改动
      - MEMORY_BACKEND=postgres
      - DATABASE_URL=postgresql://campus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/campus
      - LOGIN_FAILURE_LIMIT=${LOGIN_FAILURE_LIMIT:-5}
      - LOGIN_FAILURE_WINDOW_SECONDS=${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      # Agent 运行参数(第07章 §4.4 p26、第08章 §3.1/3.2 p34/p44)
      - RECURSION_LIMIT=${RECURSION_LIMIT:-100}
      - TOOL_CALL_THREAD_LIMIT=${TOOL_CALL_THREAD_LIMIT:-200}
      - MODEL_CALL_THREAD_LIMIT=${MODEL_CALL_THREAD_LIMIT:-200}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).read()"]
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # KB_BACKEND=chroma 时索引保存在这里；Milvus 模式下卷保持空闲。
      - chroma_data:/app/data/chroma_db
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=campus
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=campus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 向量库:课件第10章 §2.5.2(p52)用的是 Milvus
  # 这里用官方 standalone 镜像,自带 etcd/minio,无需三件套分别配置
  # 首次起来后要建库:.env 配好 EMBED_API_KEY 再跑一次建库脚本
  #   docker compose exec app python scripts/build_kb.py
  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_USE_EMBED=true
      - ETCD_DATA_DIR=/var/lib/milvus/etcd
      - ETCD_CONFIG_PATH=/milvus/configs/advanced/etcd.yaml
      - COMMON_STORAGETYPE=local
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      timeout: 5s
      retries: 5
    # 仅供 compose 内的 app 访问，不映射到宿主机公网。
    expose:
      - "19530"
      - "9091"
    restart: unless-stopped

  # 正式发布时启用 production profile，并将域名 DNS 指向服务器。
  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CAMPUS_DOMAIN=${CAMPUS_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # 可选:云端自带 Ollama。
  # 注意:按课件走的话**不需要它** —— Embedding 已改为云端网关
  # (第10章 §2.4.2 p48-49),降级备胎也已改为云端模型(第08章 §3.3 p53)。
  # 保留此 profile 仅用于"想在云端复现本地降级实验"的场景。
  # 镜像约 1-2GB,小水管服务器慎用;起了之后必须手动拉模型:
  #   docker compose exec ollama ollama pull qwen3:0.6b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  chroma_data:
  ollama_data:
  milvus_data:
  caddy_data:
  caddy_config:
